openapi: 3.1.0
info:
  title: SandWorkflow 工作流插件
  version: "1.0"
  description: SandWorkflow 管理端接口契约片段。app 目录名 sandworkflow，
    接口统一落在 /api/admin/v1/plugin/sandworkflow/ 命名空间；
    权限域按宿主契约约定使用 sand_sandworkflow:（插件代码内
    #[Permission] 注解的运行时域为 sandworkflow:，两者是不同层面的命名）。

# 插件只登记本域新增码；宿主已登记码（如 IDEMPOTENCY_KEY_REUSED）直接引用。
x-error-catalog:
  SAND_WORKFLOW_NOT_FOUND:          {http_status: 404, summary: 流程定义、实例或任务不存在}
  SAND_WORKFLOW_STATE_INVALID:      {http_status: 409, summary: 流程或任务的当前状态不允许这个操作}
  SAND_WORKFLOW_ACTION_DENIED:      {http_status: 403, summary: 当前用户不能对这个流程或任务做该操作}
  SAND_WORKFLOW_ASSIGNEE_INVALID:   {http_status: 422, summary: 处理人或接收人选择无效}
  SAND_WORKFLOW_DEFINITION_INVALID: {http_status: 422, summary: 流程定义内容不合法}

paths:
  # ── 参与人候选（发起人/处理人选择器数据源）──
  /api/admin/v1/plugin/sandworkflow/index/list-users:
    get:
      operationId: sandworkflowIndexListUsers
      summary: 可选用户列表
      tags: [sandworkflow]
      x-handler: 'plugin\sandworkflow\app\controller\IndexController::listUsers'
      x-permission: sand_sandworkflow:index:list-users
      x-mcp:
        name: sand_sandworkflow_user_list
        tier: read
        title: 可选用户列表
        description: 列出可选为流程处理人的启用用户（只读）
        input: {type: object, properties: {}, additionalProperties: false}
      responses: {'200': {description: 契约信封}}

  /api/admin/v1/plugin/sandworkflow/index/list-roles:
    get:
      operationId: sandworkflowIndexListRoles
      summary: 可选角色列表
      tags: [sandworkflow]
      x-handler: 'plugin\sandworkflow\app\controller\IndexController::listRoles'
      x-permission: sand_sandworkflow:index:list-roles
      x-mcp:
        name: sand_sandworkflow_role_list
        tier: read
        title: 可选角色列表
        description: 列出可选为流程处理人的启用角色（只读）
        input: {type: object, properties: {}, additionalProperties: false}
      responses: {'200': {description: 契约信封}}

  /api/admin/v1/plugin/sandworkflow/index/list-depts:
