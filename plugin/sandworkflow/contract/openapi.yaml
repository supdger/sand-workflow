        tier: read
        title: 可选部门列表
        description: 列出可选为流程处理人的启用部门（只读）
        input: {type: object, properties: {}, additionalProperties: false}
      responses: {'200': {description: 契约信封}}

  # ── 流程分组 ──
  /api/admin/v1/plugin/sandworkflow/group/index:
    get:
      operationId: sandworkflowGroupIndex
      summary: 流程分组列表
      tags: [sandworkflow]
      x-handler: 'plugin\sandworkflow\app\controller\GroupController::index'
      x-permission: sand_sandworkflow:group:index
